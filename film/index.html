<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CEV Siargao · Website</title>
<meta property="og:title" content="CEV Siargao · Website">
<meta property="og:image" content="poster.jpg">
<link rel="icon" href="../website/assets/img/logo.png">
<link rel="preload" href="poster.jpg" as="image">
<style>
@font-face{font-family:"Archivo";src:url(../website/assets/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:"DM Sans";src:url(../website/assets/fonts/dmsans.woff2) format("woff2");font-weight:100 1000;font-display:block}
:root{--creme:#F3EADC;--rot:#E2483A;--rot-tief:#B8332A;--teal:#0C5459;--teal-tief:#083D41;--tinte:#221B16;--weiss:#FFFDF9}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--creme);color:var(--tinte)}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;font:400 16px/1.5 "DM Sans",system-ui,sans-serif;
  padding:max(20px,env(safe-area-inset-top)) clamp(16px,4vw,64px) max(20px,env(safe-area-inset-bottom))}
.kopf{width:100%;max-width:1360px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 clamp(18px,2.4vw,32px)}
.kopf img{height:clamp(34px,3.2vw,46px);width:auto;display:block}
.kopf a.knopf{display:inline-flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px;background:var(--rot);color:var(--weiss);
  font:600 14px/1 "DM Sans",sans-serif;text-decoration:none;box-shadow:0 10px 18px -10px rgba(184,51,42,.8),inset 0 -2px 0 rgba(0,0,0,.12)}
.kopf a.knopf i{width:28px;height:28px;border-radius:50%;background:var(--weiss);color:var(--rot);display:grid;place-items:center}
.kopf svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{width:100%;max-width:1360px;flex:1;display:flex;flex-direction:column;justify-content:center}
.film{position:relative;width:100%;aspect-ratio:1920/1206;border-radius:clamp(14px,1.8vw,26px);overflow:hidden;background:var(--teal-tief) url(poster.jpg) center/cover;
  box-shadow:0 40px 60px -40px rgba(8,61,65,.55),0 2px 6px rgba(34,27,22,.12)}
.film video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:transparent}
.titel{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:clamp(18px,2vw,28px)}
.titel h1{margin:0;font:900 clamp(30px,4vw,60px)/.95 "Archivo",sans-serif;font-stretch:125%;text-transform:uppercase;color:var(--teal)}
.titel h1 span{color:var(--rot)}
.titel p{margin:0;font-size:15px;color:#6C6158}
footer{width:100%;max-width:1360px;padding-top:clamp(22px,3vw,40px);font-size:13px;color:#8C7D70;text-align:center}
@media (max-width:700px){
  main{justify-content:center;padding-bottom:6vh}
  .film{width:calc(100% + 32px);margin:0 -16px;border-radius:0}
  .titel{margin-top:22px}
  .titel h1{font-size:clamp(34px,11vw,52px)}
  .titel p{font-size:16px}
  .kopf a.knopf{padding:7px 7px 7px 14px;font-size:13px}
}
</style>
</head>
<body>
<header class="kopf">
  <img src="../website/assets/img/logo-rot.png" alt="CEV" width="160" height="46">
  <a class="knopf" href="../website/index.html">Open the website<i><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></i></a>
</header>
<main>
  <div class="film">
    <video autoplay muted loop playsinline webkit-playsinline preload="auto" poster="poster.jpg" controls disablepictureinpicture>
      <source src="cev-website-handy.mp4" type="video/mp4" media="(max-width: 900px)">
      <source src="cev-website.mp4" type="video/mp4">
    </video>
  </div>
  <div class="titel">
    <h1>Kinilaw <span>&amp; Ceviche</span></h1>
    <p>A walk through the new CEV website</p>
  </div>
</main>
<footer>Designstudie von Tasty Studios, nicht die offizielle Website.</footer>
<script>
(function(){var v=document.querySelector('video');if(!v)return;
// läuft von selbst: stumm, im Bild, Endlosschleife; startet erneut, falls der Browser das automatische Abspielen zunächst anhält
function los(){var p=v.play();if(p&&p.catch)p.catch(function(){})}
v.addEventListener('loadeddata',los);document.addEventListener('visibilitychange',function(){if(!document.hidden)los()});
document.addEventListener('touchstart',los,{once:true,passive:true});})();
</script>
<script src="../website/assets/js/besuch.js?v=1795520881" defer></script>
</body>
</html>
